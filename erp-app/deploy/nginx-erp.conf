limit_req_zone $binary_remote_addr zone=erp_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name erp.ericyiwusourcing.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.ericyiwusourcing.com;

    ssl_certificate /etc/letsencrypt/live/erp.ericyiwusourcing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.ericyiwusourcing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ERPSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 5m;

    location = /api/auth/login {
        limit_req zone=erp_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
